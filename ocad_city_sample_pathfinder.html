  dragStart = { x: event.clientX, y: event.clientY };
  dragViewBoxStart = currentViewBox();
  svg.setPointerCapture(event.pointerId);
});

svg.addEventListener("pointermove", (event) => {
  if (!isDragging) return;
  const dxPixels = event.clientX - dragStart.x;
  const dyPixels = event.clientY - dragStart.y;
  dragDistance = Math.hypot(dxPixels, dyPixels);
  const scale = dragViewBoxStart.width / svg.clientWidth;
  setViewBox({
    x: dragViewBoxStart.x - dxPixels * scale,
    y: dragViewBoxStart.y - dyPixels * scale,
    width: dragViewBoxStart.width,
    height: dragViewBoxStart.height,
  });
});

svg.addEventListener("pointerup", (event) => {
  isDragging = false;
  // A drag beyond a few pixels is a pan, not a click -- only treat it as a
  // node selection if the pointer barely moved between down and up.
  if (dragDistance < 4) {
    handleNodeClick(event);
  }
});

function nearestNode([x, y]) {
  let best = -1;
  let bestDist = Infinity;
  for (let i = 0; i < nodes.length; i++) {
    const dx = nodes[i][0] - x;
    const dy = nodes[i][1] - y;
    const dist = dx * dx + dy * dy;
    if (dist < bestDist) {
      bestDist = dist;
      best = i;
    }
  }
  return best;
}

function heuristic(a, b) {
  const dx = nodes[a][0] - nodes[b][0];
  const dy = nodes[a][1] - nodes[b][1];
  return Math.hypot(dx, dy);
}

function aStar(start, goal) {
  const openSet = [start];
  const cameFrom = new Map();
  const gScore = new Map([[start, 0]]);
  const fScore = new Map([[start, heuristic(start, goal)]]);

  while (openSet.length > 0) {
    let bestIdx = 0;
    for (let i = 1; i < openSet.length; i++) {
      if ((fScore.get(openSet[i]) ?? Infinity) < (fScore.get(openSet[bestIdx]) ?? Infinity)) {
        bestIdx = i;
      }
    }
    const current = openSet[bestIdx];
    if (current === goal) {
      const path = [current];
      let node = current;
      while (cameFrom.has(node)) {
        node = cameFrom.get(node);
        path.push(node);
      }
      path.reverse();
      return path;
    }
    openSet.splice(bestIdx, 1);

    for (const [neighbor, weight] of adjacency[current]) {
      const tentativeG = gScore.get(current) + weight;
      if (tentativeG < (gScore.get(neighbor) ?? Infinity)) {
        cameFrom.set(neighbor, current);
        gScore.set(neighbor, tentativeG);
        fScore.set(neighbor, tentativeG + heuristic(neighbor, goal));
        if (!openSet.includes(neighbor)) {
          openSet.push(neighbor);
        }
      }
    }
  }
  return null;
}

function drawEndpoint(nodeIndex, color) {
  const [x, y] = nodes[nodeIndex];
  const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  circle.setAttribute("cx", x);
  circle.setAttribute("cy", -y);
  circle.setAttribute("r", 2.5);
  circle.setAttribute("fill", color);
  circle.setAttribute("stroke", "#000000");
  circle.setAttribute("stroke-width", 0.3);
  endpointLayer.appendChild(circle);
}

function drawPath(path) {
  const points = path.map((i) => `${nodes[i][0].toFixed(3)},${(-nodes[i][1]).toFixed(3)}`).join(" ");
  const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  polyline.setAttribute("points", points);
  polyline.setAttribute("fill", "none");
  polyline.setAttribute("stroke", "#0d6dff");
  polyline.setAttribute("stroke-width", 1.2);
  polyline.setAttribute("stroke-linejoin", "round");
  pathLayer.appendChild(polyline);
}

function pathLength(path) {
  let total = 0;
  for (let i = 1; i < path.length; i++) {
    total += heuristic(path[i - 1], path[i]);
  }
  return total;
}

function reset() {
  startNode = null;
  endNode = null;
  pathLayer.replaceChildren();
  endpointLayer.replaceChildren();
  status.textContent = "Scroll to zoom, drag to pan. Click a node to set the start point.";
}

function handleNodeClick(event) {
  const nodeIndex = nearestNode(toMapPoint(event));
  if (nodeIndex === -1) return;

  if (startNode === null) {
    startNode = nodeIndex;
    drawEndpoint(startNode, "#00e676");
    status.textContent = "Click a node to set the end point.";
  } else if (endNode === null) {
    endNode = nodeIndex;
    drawEndpoint(endNode, "#2979ff");
    const path = aStar(startNode, endNode);
    if (path === null) {
      status.textContent = "No path found between those nodes. Click to start a new query.";
    } else {
      drawPath(path);
      status.textContent = `Path length: ${pathLength(path).toFixed(1)} m (${path.length} nodes). Click to start a new query.`;
    }
  } else {
    reset();
  }
}
</script>
</body>
</html>
